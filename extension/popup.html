<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Škála AI Odpovědnosti</title>
<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<table class="header">
  <tr>
    <td class="width-auto" rowspan="2">
      <h1 class="title" id="title"></h1>
      <span class="subtitle" data-i18n="subtitle"></span>
    </td>
    <th class="width-min" data-i18n="scale"></th>
    <td class="width-min" id="version"></td>
  </tr>
  <tr>
    <th class="width-min" data-i18n="language"></th>
    <td class="width-min"><select id="lang"></select></td>
  </tr>
</table>

<section id="quiz">
  <p class="meta"><span id="step"></span> · <span id="transition"></span></p>
  <h2 id="question"></h2>
  <div class="grid">
    <button id="yes" data-i18n="yes" data-i18n-title="keyHint" data-key="A"></button>
    <button id="no" data-i18n="no" data-i18n-title="keyHint" data-key="N"></button>
  </div>
  <p class="meta" data-i18n="yesMeansHtml"></p>
</section>

<section id="result" hidden>
  <p class="meta" data-i18n="yourLevel"></p>
  <p><img id="badge" alt=""></p>
  <p><img id="stamp" alt=""></p>

  <p class="meta" data-i18n="stampWidth"></p>
  <div class="grid" id="widths">
    <button data-cols="40" data-i18n="narrow" data-i18n-title="colsHint" data-n="40"></button>
    <button data-cols="60" data-i18n="medium" data-i18n-title="colsHint" data-n="60"></button>
    <button data-cols="80" data-i18n="wide" data-i18n-title="colsHint" data-n="80"></button>
  </div>

  <p class="meta" data-i18n="copy"></p>
  <div class="grid">
    <button id="copy-badge" data-i18n="badge" data-i18n-title="badgeHint"></button>
    <button id="copy-stamp" data-i18n="stamp" data-i18n-title="stampHint"></button>
    <button id="copy-text" data-i18n="text" data-i18n-title="textHint"></button>
  </div>
  <p class="meta" data-i18n="pasteHint"></p>
  <p><a href="#" id="restart" data-i18n="restart"></a></p>
</section>

<hr>
<p class="meta" data-i18n="footerHtml"></p>

<script type="module" src="popup.js"></script>
</body>
</html>
