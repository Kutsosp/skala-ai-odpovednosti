<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Škála AI Odpovědnosti</title>
<link rel="stylesheet" href="extension/fonts.css">
<style>
/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/

html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
	/*margin: 0;*/
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
/* HTML5 display-role reset for older browsers */
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}

/**
 * By Oskar Wickström
 * Licensed under the MIT License (https://github.com/owickstrom/the-monospace-web/blob/main/LICENSE.md)
 **/


:root {
  --font-family: "JetBrains Mono", monospace;
  --line-height: 1.20rem;
  --border-thickness: 2px;
  --text-color: #000;
  --text-color-alt: #666;
  --background-color: #fff;
  --background-color-alt: #eee;

  --font-weight-normal: 500;
  --font-weight-medium: 600;
  --font-weight-bold: 800;

  font-family: var(--font-family);
  font-optical-sizing: auto;
  font-weight: var(--font-weight-normal);
  font-style: normal;
  font-variant-numeric: tabular-nums lining-nums;
  font-size: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --text-color: #fff;
    --text-color-alt: #aaa;
    --background-color: #000;
    --background-color-alt: #111;
  }
}

* {
  box-sizing: border-box;
}


* + * {
  margin-top: var(--line-height);
}

html {
  display: flex;
  width: 100%;
  margin: 0;
  padding: 0;
  flex-direction: column;
  align-items: center;
  background: var(--background-color);
  color: var(--text-color);
}

body {
  position: relative;
  width: 100%;
  margin: 0;
  padding: var(--line-height) 2ch;
  max-width: calc(min(80ch, round(down, 100%, 1ch)));
  line-height: var(--line-height);
  overflow-x: hidden;
}

@media screen and (max-width: 480px) {
  :root {
    font-size: 14px;
  }
  body {
    padding: var(--line-height) 1ch;
  }
}

h1, h2, h3, h4, h5, h6 {
  font-weight: var(--font-weight-bold);
  margin: calc(var(--line-height) * 2) 0 var(--line-height);
  line-height: var(--line-height);
}

h1 {
  font-size: 2rem;
  line-height: calc(2 * var(--line-height));
  margin-bottom: calc(var(--line-height) * 2);
  text-transform: uppercase;
}
h2 {
  font-size: 1rem;
  text-transform: uppercase;
}

hr {
  position: relative;
  display: block;
  height: var(--line-height);
  margin: calc(var(--line-height) * 1.5) 0;
  border: none;
  color: var(--text-color);
}
hr:after {
  display: block;
  content: "";
  position: absolute;
  top: calc(var(--line-height) / 2 - var(--border-thickness));
  left: 0;
  width: 100%;
  border-top: calc(var(--border-thickness) * 3) double var(--text-color);
  height: 0;
}

a {
  text-decoration-thickness: var(--border-thickness);
}

a:link, a:visited {
  color: var(--text-color);
}

p {
  margin-bottom: var(--line-height);
}

strong {
  font-weight: var(--font-weight-bold);
}
em {
  font-style: italic;
}

sub {
  position: relative;
  display: inline-block;
  margin: 0;
  vertical-align: sub;
  line-height: 0;
  width: calc(1ch / 0.75);
  font-size: .75rem;
}

table {
  position: relative;
  top: calc(var(--line-height) / 2);
  width: calc(round(down, 100%, 1ch));
  border-collapse: collapse;
  margin: 0 0 calc(var(--line-height) * 2);
}

th, td {
  border: var(--border-thickness) solid var(--text-color);
  padding: 
    calc((var(--line-height) / 2))
    calc(1ch - var(--border-thickness) / 2)
    calc((var(--line-height) / 2) - (var(--border-thickness)))
  ;
  line-height: var(--line-height);
  vertical-align: top;
  text-align: left;
}
table tbody tr:first-child > * {
  padding-top: calc((var(--line-height) / 2) - var(--border-thickness));
}


th {
  font-weight: 700;
}
.width-min {
  width: 0%;
}
.width-auto {
  width: 100%;
}

.header {
  margin-bottom: calc(var(--line-height) * 2);
}
.header h1 {
  margin: 0;
}
.header tr td:last-child {
  text-align: right;
}

p {
  word-break: break-word;
  word-wrap: break-word;
  hyphens: auto;
}

img, video {
  display: block;
  width: 100%;
  object-fit: contain;
  overflow: hidden;
}
img {
  font-style: italic;
  color: var(--text-color-alt);
}

details {
  border: var(--border-thickness) solid var(--text-color);
  padding: calc(var(--line-height) - var(--border-thickness)) 1ch;
  margin-bottom: var(--line-height);
}

summary {
  font-weight: var(--font-weight-medium);
  cursor: pointer;
}
details[open] summary {
  margin-bottom: var(--line-height);
}

details ::marker {
  display: inline-block;
  content: '▶';
  margin: 0;
}
details[open] ::marker {
  content: '▼';
}

details :last-child {
  margin-bottom: 0;
}

pre {
  white-space: pre;
  overflow-x: auto;
  margin: var(--line-height) 0;
  overflow-y: hidden;
}
figure pre {
  margin: 0;
}

pre, code {
  font-family: var(--font-family);
}

code {
  font-weight: var(--font-weight-medium);
}

figure {
  margin: calc(var(--line-height) * 2) 3ch;
  overflow-x: auto;
  overflow-y: hidden;
}

figcaption {
  display: block;
  font-style: italic;
  margin-top: var(--line-height);
}

ul, ol {
  padding: 0;
  margin: 0 0 var(--line-height);
}

ul {
  list-style-type: square;
  padding: 0 0 0 2ch;
}
ol {
  list-style-type: none;
  counter-reset: item;
  padding: 0;
}
ol ul,
ol ol,
ul ol,
ul ul {
  padding: 0 0 0 3ch;
  margin: 0;
}
ol li:before { 
  content: counters(item, ".") ". ";
  counter-increment: item;
  font-weight: var(--font-weight-medium);
}

li {
  margin: 0;
  padding: 0;
}

li::marker {
  line-height: 0;
}

::-webkit-scrollbar {
    height: var(--line-height);
}

input, button, textarea {
  border: var(--border-thickness) solid var(--text-color);
  padding: 
    calc(var(--line-height) / 2 - var(--border-thickness))
    calc(1ch - var(--border-thickness));
  margin: 0;
  font: inherit;
  font-weight: inherit;
  height: calc(var(--line-height) * 2);
  width: auto;
  overflow: visible;
  background: var(--background-color);
  color: var(--text-color);
  line-height: normal;
  -webkit-font-smoothing: inherit;
  -moz-osx-font-smoothing: inherit;
  -webkit-appearance: none;
}

input[type=checkbox],
input[type=radio] {
  display: inline-grid;
  place-content: center;
  vertical-align: top;
  width: 2ch;
  height: var(--line-height);
  cursor: pointer;
}
input[type=checkbox]:checked:before,
input[type=radio]:checked:before {
  content: "";
  width: 1ch;
  height: calc(var(--line-height) / 2);
  background: var(--text-color);
}
input[type=radio],
input[type=radio]:before {
  border-radius: 100%;
}

button:focus, input:focus {
  --border-thickness: 3px;
  outline: none;
}

input {
  width: calc(round(down, 100%, 1ch));
}
::placeholder {
  color: var(--text-color-alt);
  opacity: 1;
}
::-ms-input-placeholder {
  color: var(--text-color-alt);
}
button::-moz-focus-inner {
  padding: 0;
  border: 0
}

button {
  text-transform: uppercase;
  font-weight: var(--font-weight-medium);
  cursor: pointer;
}

button:hover {
  background: var(--background-color-alt);
}
button:active {
  transform: translate(2px, 2px);
}

label {
  display: block;
  width: calc(round(down, 100%, 1ch));
  height: auto;
  line-height: var(--line-height);
  font-weight: var(--font-weight-medium);
  margin: 0;
}

label input {
  width: 100%;
}

.tree, .tree ul {
  position: relative;
  padding-left: 0;
  list-style-type: none;
  line-height: var(--line-height);
}
.tree ul {
  margin: 0;
}
.tree ul li {
  position: relative;
  padding-left: 1.5ch;
  margin-left: 1.5ch;
  border-left: var(--border-thickness) solid var(--text-color);
}
.tree ul li:before {
  position: absolute;
  display: block;
  top: calc(var(--line-height) / 2);
  left: 0;
  content: "";
  width: 1ch;
  border-bottom: var(--border-thickness) solid var(--text-color);
}
.tree ul li:last-child {
  border-left: none;
}
.tree ul li:last-child:after {
  position: absolute;
  display: block;
  top: 0;
  left: 0;
  content: "";
  height: calc(var(--line-height) / 2);
  border-left: var(--border-thickness) solid var(--text-color);
}

.grid {
  --grid-cells: 0;
  display: flex;
  gap: 1ch;
  width: calc(round(down, 100%, (1ch * var(--grid-cells)) - (1ch * var(--grid-cells) - 1)));
  margin-bottom: var(--line-height);
}

.grid > *,
.grid > input {
  flex: 0 0 calc(round(down, (100% - (1ch * (var(--grid-cells) - 1))) / var(--grid-cells), 1ch));
}
.grid:has(> :last-child:nth-child(1)) { --grid-cells: 1; }
.grid:has(> :last-child:nth-child(2)) { --grid-cells: 2; }
.grid:has(> :last-child:nth-child(3)) { --grid-cells: 3; }
.grid:has(> :last-child:nth-child(4)) { --grid-cells: 4; }
.grid:has(> :last-child:nth-child(5)) { --grid-cells: 5; }
.grid:has(> :last-child:nth-child(6)) { --grid-cells: 6; }
.grid:has(> :last-child:nth-child(7)) { --grid-cells: 7; }
.grid:has(> :last-child:nth-child(8)) { --grid-cells: 8; }
.grid:has(> :last-child:nth-child(9)) { --grid-cells: 9; }

/* DEBUG UTILITIES */

.debug .debug-grid {
  --color: color-mix(in srgb, var(--text-color) 10%, var(--background-color) 90%);
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: -1;
  background-image:
    repeating-linear-gradient(var(--color) 0 1px, transparent 1px 100%),
    repeating-linear-gradient(90deg, var(--color) 0 1px, transparent 1px 100%);
  background-size: 1ch var(--line-height);
  margin: 0;
}

.debug .off-grid {
  background: rgba(255, 0, 0, 0.1);
}

.debug-toggle-label {
  text-align: right;
}

/* Úpravy index.css pro okno rozšíření, panel v Google editorech a dialog na webu. Vše ostatní dědí ze stylu webu. */
html, body { width: 46ch; }
body { padding: var(--line-height) 2ch; }
/* Panel v nabídce Google Docs/Sheets/Slides: menší písmo, aby seděl k rozhraní Googlu */
:root:has(> body[data-host="docs"]) { font-size: 13px; width: 100%; }
body[data-host="docs"] { width: 100%; }
/* Jen v iframe (dialog na webu): okno rozšíření si šířku měří z obsahu a tohle by ho zúžilo */
@media screen and (max-width: 480px) { :root:has(> body[data-embedded]), body[data-embedded] { width: 100%; } }

h1.title { font-size: 1rem; line-height: var(--line-height); margin-bottom: 0; }
h2 { margin-top: 0; text-transform: none; font-size: 1.125rem; min-height: calc(3 * var(--line-height)); }

.meta { color: var(--text-color-alt); }
.meta strong { color: var(--text-color); }

#badge { display: block; width: 158px; height: 42px; }
#stamp { display: block; max-width: 100%; height: auto; }
button.active { background: var(--text-color); color: var(--background-color); }
[hidden] { display: none; }

/* Výběr jazyka v hlavičce: bez rámečku, dědí písmo, sedí do buňky tabulky */
select {
  font: inherit;
  color: inherit;
  background: transparent;
  border: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
select:focus { outline: var(--border-thickness) solid var(--text-color); outline-offset: 2px; }

/* Posuvník šířky razítka: čára a čtvercový jezdec v duchu monospace */
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: var(--line-height);
  padding: 0;
  border: none;
  background: transparent;
  margin-bottom: var(--line-height);
  cursor: ew-resize;
}
input[type=range]::-webkit-slider-runnable-track {
  height: var(--border-thickness);
  background: var(--text-color);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 2ch;
  height: var(--line-height);
  margin-top: calc((var(--line-height) - var(--border-thickness)) / -2);
  background: var(--text-color);
  border: none;
}
input[type=range]:focus { outline: none; }
input[type=range]:focus::-webkit-slider-thumb { outline: var(--border-thickness) solid var(--text-color-alt); }

</style>
</head>
<body data-host="extension">

<table class="header">
  <tr>
    <td class="width-auto">
      <h1 class="title" id="title"></h1>
      <span class="subtitle" data-i18n="subtitle"></span>
    </td>
    <td class="width-min"><strong data-i18n="language"></strong><br><select id="lang"></select></td>
  </tr>
</table>

<section id="quiz">
  <p class="meta"><span id="step"></span> · <span id="transition"></span></p>
  <h2 id="question"></h2>
  <div class="grid">
    <button id="yes" data-i18n="yes" data-i18n-title="keyHint" data-key="A"></button>
    <button id="no" data-i18n="no" data-i18n-title="keyHint" data-key="N"></button>
  </div>
  <p class="meta" data-i18n="yesMeansHtml"></p>
</section>

<section id="result" hidden>
  <p class="meta" data-i18n="yourLevel"></p>
  <p><img id="badge" alt=""></p>
  <p><img id="stamp" alt=""></p>

  <p class="meta"><span data-i18n="stampWidth"></span> · <span id="cols-readout"></span></p>
  <input type="range" id="cols" min="24" max="120" step="1" value="60">

  <!-- Rozšíření: kopírování do schránky -->
  <div id="copy-actions">
    <p class="meta" data-i18n="copy"></p>
    <div class="grid">
      <button id="copy-badge" data-i18n="badge" data-i18n-title="badgeHint"></button>
      <button id="copy-stamp" data-i18n="stamp" data-i18n-title="stampHint"></button>
      <button id="copy-text" data-i18n="text" data-i18n-title="textHint"></button>
    </div>
    <p class="meta" data-i18n="pasteHint"></p>
  </div>

  <!-- Panel v Google Docs / Sheets / Slides: vložení přímo do dokumentu -->
  <div id="insert-actions" hidden>
    <p class="meta" data-i18n="insert"></p>
    <div class="grid">
      <button id="insert-badge" data-i18n="badge" data-i18n-title="badgeHint"></button>
      <button id="insert-stamp" data-i18n="stamp" data-i18n-title="stampHint"></button>
    </div>
    <p class="meta" id="insert-hint"></p>
  </div>

  <p><a href="#" id="restart" data-i18n="restart"></a></p>
</section>

<hr>
<p class="meta" data-i18n="footerHtml"></p>

<script>
(async () => {
// ---- render.js
// Kreslí odznak a razítko na canvas písmem JetBrains Mono z rozšíření, takže vypadají
// stejně jako na webu bez ohledu na písma příjemce. Stejné rozměry jako badges/build.py.

const FONT_SIZE = 16, CH = 9.6, LINE = 19.2, BORDER = 2, SCALE = 2;
const FAMILY = `"JetBrains Mono"`;
const CAP = 0.73 * FONT_SIZE;                        // výška verzálek
const ASCENT = 1.02 * FONT_SIZE, DESCENT = 0.3 * FONT_SIZE;

const fontsReady = Promise.all([500, 800].map((w) => document.fonts.load(`${w} ${FONT_SIZE}px ${FAMILY}`)));

function canvas(w, h, fill) {
  const c = document.createElement("canvas");
  c.width = w * SCALE;
  c.height = h * SCALE;
  const ctx = c.getContext("2d");
  ctx.scale(SCALE, SCALE);
  ctx.fillStyle = fill;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = BORDER;
  ctx.strokeRect(BORDER / 2, BORDER / 2, w - BORDER, h - BORDER);
  ctx.fillStyle = "#000";
  return [c, ctx];
}

// Zalomení po slovech na nejvýše `cols` znaků (monospace, takže znak = sloupec).
function wrap(text, cols) {
  const lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    if (line && line.length + 1 + word.length > cols) {
      lines.push(line);
      line = word;
    } else {
      line = line ? `${line} ${word}` : word;
    }
  }
  if (line) lines.push(line);
  return lines;
}

/** Odznak: rámeček 158×42 s názvem úrovně, jako v ASCII diagramu na webu. */
async function renderBadge(label) {
  await fontsReady;
  const w = Math.round(2 * BORDER + 16 * CH), h = Math.round(2 * BORDER + 2 * LINE);
  const [c, ctx] = canvas(w, h, "#fff");
  ctx.font = `500 ${FONT_SIZE}px ${FAMILY}`;
  ctx.fillText(label, BORDER + CH, h / 2 + CAP / 2);
  return c;
}

/** Razítko: šedý rámeček s tučným názvem a textem odpovědnosti zalomeným na `cols` znaků. */
async function renderStamp(label, text, cols) {
  await fontsReady;
  const lines = wrap(`${label}  ${text}`, cols);
  const w = Math.round(2 * BORDER + (cols + 4) * CH);
  const h = Math.round(2 * BORDER + (lines.length + 2) * LINE);
  const [c, ctx] = canvas(w, h, "#eee");
  const x0 = BORDER + 2 * CH;
  const firstBaseline = BORDER + LINE + (LINE - ASCENT - DESCENT) / 2 + ASCENT;
  lines.forEach((line, i) => {
    const y = firstBaseline + i * LINE;
    if (i === 0) {
      ctx.font = `800 ${FONT_SIZE}px ${FAMILY}`;
      ctx.fillText(label, x0, y);
      ctx.font = `500 ${FONT_SIZE}px ${FAMILY}`;
      ctx.fillText(line.slice(label.length), x0 + label.length * CH, y);
    } else {
      ctx.fillText(line, x0, y);
    }
  });
  return c;
}

const toBlob = (c) => new Promise((resolve) => c.toBlob(resolve, "image/png"));
const cssSize = (c) => ({ width: c.width / SCALE, height: c.height / SCALE });

// ---- i18n.js
// Texty: obsah škály (scale/<jazyk>.json, kopie ze složky scale/ v repozitáři) a texty rozhraní
// (locales/<jazyk>.json). SCALE_SOURCE lze později přesměrovat na vzdálený zdroj se stejnou strukturou.
// Jednosouborová verze pro web (odznak.html) dostává tatáž data v globálu BUNDLED_DATA (apps-script/build.py).

const SCALE_SOURCE = "scale/";
const UI_SOURCE = "locales/";
const STORAGE_KEY = "language";

const json = (url) => fetch(url).then((r) => (r.ok ? r.json() : Promise.reject(new Error(`${url}: ${r.status}`))));

/** Jazyky, pro které existuje obsah škály i texty rozhraní. */
async function availableLanguages() {
  const bundled = globalThis.BUNDLED_DATA;
  if (bundled) {
    return bundled.index.map((code) => ({ code, name: bundled.scale[code].languageName, scale: bundled.scale[code], ui: bundled.ui[code] }));
  }
  const codes = await json(`${SCALE_SOURCE}index.json`);
  const found = await Promise.all(
    codes.map((code) =>
      Promise.all([json(`${SCALE_SOURCE}${code}.json`), json(`${UI_SOURCE}${code}.json`)])
        .then(([scale, ui]) => ({ code, name: scale.languageName, scale, ui }))
        .catch(() => null),
    ),
  );
  return found.filter(Boolean);
}

// localStorage může být v sandboxu doplňku nedostupné
const storage = {
  get: () => { try { return localStorage.getItem(STORAGE_KEY); } catch { return null; } },
  set: (v) => { try { localStorage.setItem(STORAGE_KEY, v); } catch {} },
};

/** Uložený jazyk, jinak jazyk prohlížeče, jinak první dostupný. */
function pickLanguage(languages) {
  const saved = storage.get();
  const browser = navigator.language.slice(0, 2);
  return languages.find((l) => l.code === saved) || languages.find((l) => l.code === browser) || languages[0];
}

const rememberLanguage = (code) => storage.set(code);

/** Dosadí {klíč} z vars. */
const t = (template, vars = {}) => template.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? `{${k}}`);

/** Vyplní prvky s data-i18n="klíč" (a data-i18n-title pro title). Klíče končící na Html se vkládají jako HTML. */
function applyUi(ui, vars = {}) {
  for (const el of document.querySelectorAll("[data-i18n]")) {
    const key = el.dataset.i18n;
    const text = t(ui[key] ?? key, vars);
    if (key.endsWith("Html")) el.innerHTML = text;
    else el.textContent = text;
  }
  for (const el of document.querySelectorAll("[data-i18n-title]")) {
    el.title = t(ui[el.dataset.i18nTitle] ?? el.dataset.i18nTitle, { ...vars, ...el.dataset });
  }
}

// ---- popup.js

// Stejný kód běží ve dvou hostitelích:
//  extension – okno rozšíření a dialog na webu (odznak.html): kopíruje do schránky
//  docs      – panel vložený rozšířením do Google Docs/Sheets/Slides (docs.js): vkládá přes Apps Script API
const query = new URLSearchParams(location.search);
const HOST = query.get("host") || "extension";
const KIND = query.get("kind"); // docs | sheets | slides
document.body.dataset.host = HOST; // pro CSS (popup.css)
if (window.top !== window.self) document.body.dataset.embedded = ""; // iframe na webu nebo v Docs
const $ = (id) => document.getElementById(id);
let scale, ui, questions; // aktuální jazyk
let index = 0;
let level = null;
let cols = 60; // šířka textu razítka ve znacích
let badge = null, stamp = null; // vykreslené canvasy

const label = () => `${level.n} ${level.name}`;
const stampText = () => `${level.responsibility} ${level.when}`;
// Odznak odkazuje na stránku své úrovně (uroven/2-overeno.html), ne na hlavní stránku: ta začíná
// vlastním razítkem a čtenáře odznaku by mátla.
const levelUrl = () => `${scale.url}${scale.levelsPath}/${level.n}-${level.slug}.html`;
const vars = () => ({ label: label(), title: scale.title, url: levelUrl(), responsibility: level.responsibility, text: stampText() });

function showQuestion() {
  const from = scale.levels[Math.floor(index / 3)];
  const to = scale.levels[Math.floor(index / 3) + 1];
  $("step").textContent = t(ui.questionOf, { n: index + 1, total: questions.length });
  $("transition").textContent = `${from.n} ${from.name} → ${to.n} ${to.name}`;
  $("question").textContent = questions[index];
}

async function drawStamp() {
  stamp = await renderStamp(label(), stampText(), cols);
  $("stamp").src = stamp.toDataURL();
  $("cols-readout").textContent = t(ui.colsReadout, { n: cols, px: cssSize(stamp).width });
}

async function finish(n) {
  level = scale.levels[n];
  badge = await renderBadge(label());
  $("badge").src = badge.toDataURL();
  $("badge").alt = $("stamp").alt = label();
  await drawStamp();
  $("quiz").hidden = true;
  $("result").hidden = false;
}

function restart() {
  index = 0;
  $("result").hidden = true;
  $("quiz").hidden = false;
  showQuestion();
}

const blobToDataUrl = (blob) =>
  new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });

// Rozšíření: do schránky jde HTML (Gmail…), čistý obrázek (aplikace, které berou jen obrázky)
// a prostý text (pole bez formátování). Obrázek je data URI: zobrazí se i bez rozšíření.
async function copyImage(c) {
  const png = await toBlob(c);
  const { width, height } = cssSize(c);
  const title = t(ui.linkTitle, vars());
  const html =
    `<a href="${levelUrl()}" title="${title}">` +
    `<img src="${await blobToDataUrl(png)}" width="${width}" height="${height}" alt="${t(ui.altText, vars())}" title="${title}">` +
    `</a>`;
  await navigator.clipboard.write([
    new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([t(ui.plainText, vars())], { type: "text/plain" }),
      "image/png": png,
    }),
  ]);
}

// Panel v Google editoru: obrázek jde jako base64 do Apps Scriptu (apps-script/Code.gs), který ho uloží
// přímo do dokumentu s odkazem. Kam: Docs první řádek, Sheets vybraná buňka, Slides aktuální snímek.
function insertImage(c, button) {
  const { width, height } = cssSize(c);
  const params = {
    kind: KIND, docId: query.get("doc"), gid: query.get("gid"), range: query.get("range"), pageId: query.get("page"),
    base64: c.toDataURL().split(",")[1], width, height,
    url: levelUrl(), label: label(), title: t(ui.linkTitle, vars()), alt: t(ui.altText, vars()),
  };
  button.disabled = true;
  return runScript("insertBadge", params)
    .then(() => flash(button, ui.inserted), (e) => flash(button, e.message, 4000))
    .finally(() => (button.disabled = false));
}

function flash(button, text, ms = 1500) {
  const original = button.textContent;
  button.textContent = text;
  setTimeout(() => (button.textContent = original), ms);
}

function useLanguage(lang) {
  ({ scale, ui } = lang);
  questions = scale.questions.flat();
  document.documentElement.lang = lang.code;
  document.title = $("title").textContent = scale.title;
  applyUi(ui, { title: scale.title, url: scale.url });
  $("lang").value = lang.code;
  if (KIND) $("insert-hint").textContent = ui[`insertHint_${KIND}`] ?? "";
  if (level) finish(level.n); // překreslit výsledek v novém jazyce
  else showQuestion();
}

$("yes").onclick = () => (++index === questions.length ? finish(3) : showQuestion());
$("no").onclick = () => finish(Math.floor(index / 3));
$("cols").oninput = (e) => ((cols = Number(e.target.value)), drawStamp());
$("copy-badge").onclick = (e) => copyImage(badge).then(() => flash(e.target, ui.copied));
$("copy-stamp").onclick = (e) => copyImage(stamp).then(() => flash(e.target, ui.copied));
$("copy-text").onclick = (e) => navigator.clipboard.writeText(t(ui.plainText, vars())).then(() => flash(e.target, ui.copied));
$("insert-badge").onclick = (e) => insertImage(badge, e.target);
$("insert-stamp").onclick = (e) => insertImage(stamp, e.target);
$("restart").onclick = (e) => (e.preventDefault(), restart());
document.addEventListener("keydown", (e) => {
  if ($("quiz").hidden) return;
  if (e.key === "a" || e.key === "A") $("yes").click();
  if (e.key === "n" || e.key === "N") $("no").click();
});

if (HOST === "docs") {
  $("copy-actions").hidden = true;
  $("insert-actions").hidden = false;
}

const languages = await availableLanguages();
for (const l of languages) $("lang").append(new Option(l.name, l.code));
$("lang").onchange = () => {
  rememberLanguage($("lang").value);
  useLanguage(languages.find((l) => l.code === $("lang").value));
};
useLanguage(languages.find((l) => l.code === query.get("lang")) || pickLanguage(languages)); // ?lang= vynutí jazyk (anglická stránka)

})();
</script>
