# Při tagu v* zabalí rozšíření do zipu a připojí ho k vydání na GitHubu.
# Kolegové si zip stáhnou z Releases a načtou ho v chrome://extensions (viz README).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          cd extension
          zip -r "../skala-ai-odpovednosti-extension-${GITHUB_REF_NAME}.zip" . -x ".*"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.zip --title "$GITHUB_REF_NAME" --generate-notes
